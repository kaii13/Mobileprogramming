<!DOCTYPE html>
<html>
<head>
    <title>Simple JavaScript Example</title>
</head>
<body>

<h2>JavaScript Fundamentals</h2>
<p>Parth</p>

<p id="demo"></p>

<script>
let a = 8;
let b = 4;

let total = a + b;


if (total > 10) {
    document.getElementById("demo").innerHTML = "Total is greater than 10: " + total;
} else {
    document.getElementById("demo").innerHTML = "Total is 10 or less: " + total;
}
</script>

</body>
</html>
