<!DOCTYPE html>
<html>
<head>
<style>
    body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f0f0;
        font-family: Arial;
    }

    #myDiv {
        width: 180px;
        height: 100px;
        background-color: skyblue;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        border-radius: 10px;
        position: absolute;
        transition: all 1s ease; /* smooth animation */
    }
</style>
</head>

<body>

<div id="myDiv">Hello!</div>

<button onclick="startAnimation()" 
style="position:absolute; bottom:40px; padding:10px 20px;">
Start Animation
</button>

<script>
function startAnimation() {
    let box = document.getElementById("myDiv");

    // Move position + hide + change color + change size + background
    box.style.transform = "translateX(200px) translateY(-150px)";
    box.style.opacity = "0";
    box.style.backgroundColor = "orange";
    box.style.color = "white";
    box.style.fontSize = "35px";

    // After 1 second → bring back to original position
    setTimeout(() => {
        box.style.transform = "translateX(0) translateY(0)";
        box.style.opacity = "1";
        box.style.backgroundColor = "skyblue";
        box.style.color = "black";
        box.style.fontSize = "20px";
    }, 1000); // must match transition time
}
</script>

</body>
</html>
